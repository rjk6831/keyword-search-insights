[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-search-insights"
version = "0.1.0"
description = "Offline analysis and OHLC views for normalized search-interest series"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Raymond J. Kraft"}]

[project.scripts]
keyword-search-insights = "keyword_search_insights.cli:main"

[tool.setuptools.packages.find]
include = ["keyword_search_insights*"]
